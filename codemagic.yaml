workflows:
  react-native-ios:
    name: AllergyBuster iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - app_store
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.allergybusterapp
      vars:
        BUNDLE_ID: "com.allergybusterapp"
      node: 22.11.0

    scripts:
      - name: Install dependencies
        script: |
          cd AllergyBusterApp
          rm -f package-lock.json
          npm install

      - name: Patch openiap Swift sources before pod install
        script: |
          # StoreKitTypesBridge.swift in openiap was written against iOS 26 beta StoreKit APIs
          # that were removed from the final Xcode 26.4 SDK:
          #   Product.SubscriptionInfo.PricingTerms / BillingPlanType
          #   Product.PurchaseOption.billingPlanType
          #   Transaction.billingPlanType / commitmentInfo
          #   Product.SubscriptionInfo.RenewalInfo.commitmentInfo / renewalBillingPlanType
          # These are subscription-only APIs; AllergyBuster only uses non-consumable IAP
          # so none of these code paths execute at runtime.
          BRIDGE="AllergyBusterApp/node_modules/openiap/packages/apple/Sources/Helpers/StoreKitTypesBridge.swift"
          if [ -f "$BRIDGE" ]; then
            python3 - "$BRIDGE" << 'PYEOF'
import sys

path = sys.argv[1]

# APIs present in iOS 26 beta but removed from Xcode 26.4 final SDK
REMOVED = [
    '.billingPlanType',
    '.commitmentInfo',
    '.renewalBillingPlanType',
    '.pricingTerms',
    'PricingTerms',
    'BillingPlanType',
    'SubscriptionBillingPlanTypeIOS',
]

with open(path) as f:
    lines = f.readlines()

patched = []
skip_depth = 0

for line in lines:
    if skip_depth > 0:
        skip_depth += line.count('{') - line.count('}')
        patched.append('// XCODE26 ' + line.rstrip() + '\n')
        continue

    if any(r in line for r in REMOVED):
        net = line.count('{') - line.count('}')
        if net > 0:
            skip_depth = net
        patched.append('// XCODE26 ' + line.rstrip() + '\n')
    else:
        patched.append(line)

with open(path, 'w') as f:
    f.writelines(patched)

n = sum(1 for l in patched if l.startswith('// XCODE26'))
print(f"Patched {n} lines in StoreKitTypesBridge.swift")
PYEOF
          else
            echo "WARNING: StoreKitTypesBridge.swift not found — searching..."
            find AllergyBusterApp/node_modules -name "StoreKitTypesBridge.swift" 2>/dev/null || echo "not found"
          fi

      - name: Install CocoaPods
        script: |
          cd AllergyBusterApp/ios
          pod install

      - name: Set up keychain
        script: |
          keychain initialize

      - name: Fetch signing files from Apple
        script: |
          app-store-connect fetch-signing-files com.allergybusterapp \
            --type IOS_APP_STORE \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY" \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Build and export IPA
        script: |
          PROFILE=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          UUID=$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -)
          TEAM=$(security cms -D -i "$PROFILE" | plutil -extract TeamIdentifier.0 raw -)

          cat > /tmp/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.allergybusterapp</key>
              <string>$UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

          mkdir -p /tmp/xcodebuild_logs

          xcodebuild \
            -workspace AllergyBusterApp/ios/AllergyBusterApp.xcworkspace \
            -scheme AllergyBusterApp \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/AllergyBusterApp.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE="$UUID" \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            2>&1 | tee /tmp/xcodebuild_logs/archive.log

          echo "=== SWIFT/COMPILE ERRORS ==="
          grep -E "error:|swift:|SwiftCompile" /tmp/xcodebuild_logs/archive.log | grep -v "^note:" | head -80 || true
          echo "=== END ERRORS ==="

          xcodebuild \
            -exportArchive \
            -archivePath $CM_BUILD_DIR/AllergyBusterApp.xcarchive \
            -exportPath $CM_BUILD_DIR/ipa \
            -exportOptionsPlist /tmp/ExportOptions.plist

      - name: Clean up keychain
        script: |
          keychain delete

    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
